plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.pdfsorter'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.pdfsorter'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
